<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart To-Do App</title>
  <style>
    :root {
      --primary: #4CAF50;
      --danger: #f44336;
      --bg: #f9f9f9;
      --text: #333;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #f1f8e9);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #fff;
      margin-top: 40px;
      width: 95%;
      max-width: 480px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      background-color: var(--primary);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #388e3c;
    }

    .section-title {
      margin-top: 25px;
      font-size: 1.2em;
      border-bottom: 2px solid #ccc;
      padding-bottom: 4px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: var(--bg);
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions button {
      margin-left: 8px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    .complete {
      color: var(--primary);
    }

    .delete {
      color: var(--danger);
    }

    @media (max-width: 480px) {
      .input-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 My To-Do List</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Enter a new task..." />
      <button onclick="addTask()">Add</button>
    </div>

    <div>
      <h2 class="section-title">🕒 Pending Tasks</h2>
      <ul id="pendingTasks"></ul>
    </div>

    <div>
      <h2 class="section-title">✅ Completed Tasks</h2>
      <ul id="completedTasks"></ul>
    </div>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const taskText = input.value.trim();
      if (!taskText) return;

      const li = document.createElement("li");
      li.innerHTML = `
        <span>${taskText}</span>
        <div class="actions">
          <button class="complete" onclick="markDone(this)">✔</button>
          <button class="delete" onclick="deleteTask(this)">✖</button>
        </div>
      `;

      document.getElementById("pendingTasks").appendChild(li);
      input.value = "";
    }

    function markDone(btn) {
      const li = btn.closest("li");
      btn.remove(); // Remove the complete button
      document.getElementById("completedTasks").appendChild(li);
    }

    function deleteTask(btn) {
      const li = btn.closest("li");
      li.remove();
    }
  </script>
</body>
</html>
